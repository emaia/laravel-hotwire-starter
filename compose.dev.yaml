x-runtime: &runtime
  image: hotwire-starter:dev
  restart: unless-stopped
  init: true
  volumes:
    - ./:/var/www/html
  networks:
    - backend

services:
  app:
    <<: *runtime
    build:
      context: .
      target: dev
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    expose:
      - '8080'
      - '5173'
    environment:
      HEALTHCHECK_PATH: /up
      PHP_UPLOAD_MAX_FILE_SIZE: '25M'
      PW_TEST_CONNECT_WS_ENDPOINT: ws://browser:3000/
    depends_on:
      db:
        condition: service_healthy
    networks:
      frontend:
      backend:
      browser:
        aliases:
          - app.test

  scheduler:
    <<: *runtime
    command: ['php', 'artisan', 'schedule:work']
    stop_signal: SIGTERM
    healthcheck:
      test: ['CMD', 'healthcheck-schedule']
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy

  queue:
    <<: *runtime
    command: ['php', 'artisan', 'queue:work', '--tries=3', '--max-time=3600']
    environment:
      PHP_MEMORY_LIMIT: 512M
    stop_signal: SIGTERM
    stop_grace_period: 90s
    healthcheck:
      test: ['CMD', 'healthcheck-queue']
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy

  browser:
    image: hotwire-starter:browser
    profiles: ['browser']
    build:
      context: .
      target: browser
    init: true
    shm_size: 1gb
    networks:
      - browser

  db:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    volumes:
      - ./docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/02-create-testing-database.sql:ro
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hotwire_starter}
      POSTGRES_USER: ${DB_USERNAME:-hotwire_starter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      - '127.0.0.1:${FORWARD_DB_PORT:-15432}:5432'
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    expose:
      - '1025'
    ports:
      - '127.0.0.1:${FORWARD_MAIL_PORT:-18025}:8025'
    networks:
      - backend

  proxy:
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_HOST: ${APP_HOST:-hotwire-starter.localhost}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports:
      - '127.0.0.1:${HTTP_PORT:-8080}:80'
      - '127.0.0.1:${HTTPS_PORT:-8443}:443'
      - '127.0.0.1:${HTTPS_PORT:-8443}:443/udp'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend

volumes:
  postgres_data:
  mailpit_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
  browser:
    driver: bridge
    internal: true
