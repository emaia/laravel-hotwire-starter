x-runtime: &runtime
  image: hotwire-starter:production
  restart: unless-stopped
  init: true
  volumes:
    - ./:/var/www/html
  environment: &php-environment
    APP_ENV: production
    APP_DEBUG: 'false'
    PHP_OPCACHE_ENABLE: '1'
    # Revalidate PHP files because production releases are bind-mounted.
    PHP_OPCACHE_VALIDATE_TIMESTAMPS: '1'
  networks:
    - backend

services:
  app:
    <<: *runtime
    build:
      context: .
      target: production
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    expose:
      - '8080'
    environment:
      <<: *php-environment
      HEALTHCHECK_PATH: /up
      PHP_UPLOAD_MAX_FILE_SIZE: '25M'
      AUTORUN_ENABLED: 'true'
      CADDY_LOG_OUTPUT: discard
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend

  scheduler:
    <<: *runtime
    command: ['php', 'artisan', 'schedule:work']
    stop_signal: SIGTERM
    healthcheck:
      test: ['CMD', 'healthcheck-schedule']
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy

  queue:
    <<: *runtime
    command: ['php', 'artisan', 'queue:work', '--tries=3', '--max-time=3600']
    environment:
      <<: *php-environment
      PHP_MEMORY_LIMIT: 512M
    stop_signal: SIGTERM
    stop_grace_period: 90s
    healthcheck:
      test: ['CMD', 'healthcheck-queue']
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${DB_DATABASE:?Defina DB_DATABASE no .env}
      POSTGRES_USER: ${DB_USERNAME:?Defina DB_USERNAME no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    expose:
      - '5432'
    networks:
      - backend
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  proxy:
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_HOST: ${APP_HOST:?Defina APP_HOST no .env}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./docker/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  caddy_logs:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
